  <meta property="og:description" content="Get in touch with Aaron Dodson about design work, roles, and collaborations.">

  <meta property="og:image" content="https://aarondodson.com/images/aaron-portrait.jpg">
  <meta property="og:image:width" content="900">

</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="page">
    <header class="site-header">
      <a class="site-logo" href="index.html"><img src="ajd-logo.svg" width="628" height="182" alt="Aaron Dodson"></a>
      <nav class="site-nav" aria-label="Portfolio navigation">
        <a href="work.html">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </header>
    <main id="main-content" tabindex="-1" class="interior-main contact-layout" aria-labelledby="contact-title">
      <div class="contact-info" id="contact">
        <h1 class="page-title" id="contact-title">Contact</h1>
        <nav class="contact-links" aria-label="Contact links">
          <a class="text-button" href="mailto:aaron@aarondodson.com">
            Email me directly
            <svg viewBox="0 0 104 80" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M5 40h94M61 5c0 19 17 35 38 35-21 0-38 16-38 35"/>
              </svg>
          </a>
          <a class="text-button" href="https://www.linkedin.com/in/aaronjdodson/" target="_blank" rel="noopener noreferrer">
            LinkedIn
            <svg viewBox="0 0 104 80" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M5 40h94M61 5c0 19 17 35 38 35-21 0-38 16-38 35"/>
              </svg>
          </a>
          <a class="text-button" href="https://dribbble.com/aarondodson" target="_blank" rel="noopener noreferrer">
            Dribbble
            <svg viewBox="0 0 104 80" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M5 40h94M61 5c0 19 17 35 38 35-21 0-38 16-38 35"/>
              </svg>
          </a>
          <a class="text-button" href="https://www.instagram.com/aarondodson/" target="_blank" rel="noopener noreferrer">
            Instagram
            <svg viewBox="0 0 104 80" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M5 40h94M61 5c0 19 17 35 38 35-21 0-38 16-38 35"/>
              </svg>
          </a>
        </nav>
      </div>
      <div class="contact-panel">
        <svg class="contact-chat-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M15 10h34a9 9 0 0 1 9 9v21a9 9 0 0 1-9 9H29L16 58v-9h-1a9 9 0 0 1-9-9V19a9 9 0 0 1 9-9Z"/>
          <path class="contact-chat-lines" d="M18 25h28M18 34h19"/>
          <path class="contact-chat-check" pathLength="1" d="m19 29 8 8 17-17"/>
        </svg>
        <form class="contact-form" action="https://formsubmit.co/aaron@aarondodson.com" method="post">
          <input type="hidden" name="_subject" value="New portfolio contact">
          <div class="contact-letter">
            <p>Hi Aaron,</p>
            <p class="contact-line"><label for="contact-name">I’m</label> <input id="contact-name" name="name" aria-label="Your name" autocomplete="name" placeholder="your name" maxlength="100" required></p>
            <p class="contact-line"><label for="contact-topic">I’m reaching out about</label> <input id="contact-topic" name="topic" placeholder="a project or idea" maxlength="150" required></p>
            <div class="contact-details">
              <label for="contact-message">Here’s what I have in mind.</label>
              <textarea id="contact-message" name="message" rows="3" maxlength="1200" required></textarea>
            </div>
            <p class="contact-line"><label for="contact-email">You can reach me at</label> <input id="contact-email" name="email" type="email" autocomplete="email" placeholder="your@email.com" maxlength="254" required></p>
          </div>
          <div class="contact-actions">
            <button class="text-link" type="submit">Send message <span aria-hidden="true">↗</span></button>
          </div>
        </form>
        <div class="contact-confirmation" hidden>
          <h2 tabindex="-1">Message sent.</h2>
          <p>Thanks for reaching out.</p>
        </div>
      </div>
    </main>
  </div>
  <script>
    const form = document.querySelector('.contact-form');
    const requiredFields = form.querySelectorAll('[required]');
    const returnKey = 'portfolio-contact-return';
    const currentUrl = new URL(window.location.href);
    const sentToken = currentUrl.searchParams.get('sent');

    if (sentToken) {
      currentUrl.searchParams.delete('sent');
      window.history.replaceState(null, '', currentUrl);

      let confirmed = false;
      try {
        confirmed = sessionStorage.getItem(returnKey) === sentToken;
        if (confirmed) sessionStorage.removeItem(returnKey);
      } catch {
        // The provider's confirmation remains available when storage is blocked.
      }

      if (confirmed) {
        const confirmation = document.querySelector('.contact-confirmation');
        form.hidden = true;
        confirmation.hidden = false;
        form.parentElement.classList.add('is-sent');
        confirmation.querySelector('h2').focus();
      }
    }

    for (const field of requiredFields) {
      field.addEventListener('input', () => field.setCustomValidity(''));
    }

    form.addEventListener('submit', (event) => {
      for (const field of requiredFields) {
        field.setCustomValidity(field.value.trim() ? '' : 'Please fill in this blank.');
      }

      if (!form.reportValidity()) {
        event.preventDefault();
        return;
      }

      try {
        const token = crypto.randomUUID();
        sessionStorage.setItem(returnKey, token);
        const returnUrl = new URL(currentUrl.pathname, currentUrl.origin);
        returnUrl.searchParams.set('sent', token);
        let next = form.elements.namedItem('_next');
        if (!next) {
          next = document.createElement('input');
          next.type = 'hidden';
          next.name = '_next';
          form.append(next);
        }
        next.value = returnUrl.href;
      } catch {
        // FormSubmit shows its own confirmation when a custom return is unavailable.
      }
    });
  </script>
</body>
</html>
