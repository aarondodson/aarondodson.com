<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Get in touch with Aaron Dodson about design work, roles, and collaborations.">
  <title>Contact — Aaron Dodson</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Aaron Dodson">
  <meta property="og:title" content="Contact — Aaron Dodson">
  <meta property="og:description" content="Get in touch with Aaron Dodson about design work, roles, and collaborations.">
  <meta property="og:url" content="https://aarondodson.com/contact.html">
  <meta property="og:image" content="https://aarondodson.com/images/aaron-portrait.jpg">
  <meta property="og:image:width" content="900">
  <meta property="og:image:height" content="1200">
  <meta property="og:image:alt" content="Black-and-white portrait of Aaron Dodson">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=League+Gothic&amp;display=swap">
  <link rel="stylesheet" href="styles.css?v=interaction-polish">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="page">
    <header class="site-header">
      <a class="site-logo" href="index.html"><img src="ajd-logo.svg" width="628" height="182" alt="Aaron Dodson"></a>
      <nav class="site-nav" aria-label="Portfolio navigation">
        <a href="work.html">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </header>
    <main id="main-content" tabindex="-1" class="interior-main contact-main">
      <h1 class="page-title">Contact <svg class="label-accent" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><path d="M8 1v14M2 4.5l12 7M2 11.5l12-7"/></svg></h1>
      <form class="contact-form" action="https://formsubmit.co/aaron@aarondodson.com" method="post">
        <input type="hidden" name="_subject" value="New portfolio contact">
        <div class="contact-letter">
          <p>Hi Aaron,</p>
          <p><label for="contact-name">I’m</label> <input id="contact-name" name="name" aria-label="Your name" autocomplete="name" placeholder="your name" maxlength="100" required></p>
          <p><label for="contact-topic">I’m reaching out about</label> <input id="contact-topic" name="topic" placeholder="a project, a role, or an idea" maxlength="150" required></p>
          <div class="contact-details">
            <label for="contact-message">Here’s what I have in mind.</label>
            <textarea id="contact-message" name="message" rows="3" placeholder="Tell me a little about it" maxlength="1200" required></textarea>
          </div>
          <p><label for="contact-email">You can reach me at</label> <input id="contact-email" name="email" type="email" autocomplete="email" placeholder="your@email.com" maxlength="254" required></p>
        </div>
        <div class="contact-actions">
          <button class="text-link" type="submit">Send message <span aria-hidden="true">↗</span></button>
          <p>You may be asked to complete a spam check.</p>
        </div>
      </form>
      <p>Prefer to write from scratch? <a href="mailto:aaron@aarondodson.com">aaron@aarondodson.com</a></p>
    </main>
    <footer class="section-row site-footer" id="contact">
      <h2 class="section-label">Get in touch</h2>
      <div class="footer-links">
        <a class="text-link" href="https://www.linkedin.com/in/aaronjdodson/" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">↗</span></a>
        <a class="text-link" href="https://dribbble.com/aarondodson" target="_blank" rel="noopener noreferrer">Dribbble <span aria-hidden="true">↗</span></a>
        <a class="text-link" href="https://www.instagram.com/aarondodson/" target="_blank" rel="noopener noreferrer">Instagram <span aria-hidden="true">↗</span></a>
      </div>
    </footer>
  </div>
  <script>
    const form = document.querySelector('.contact-form');
    const requiredFields = form.querySelectorAll('[required]');

    for (const field of requiredFields) {
      field.addEventListener('input', () => field.setCustomValidity(''));
    }

    form.addEventListener('submit', (event) => {
      for (const field of requiredFields) {
        field.setCustomValidity(field.value.trim() ? '' : 'Please fill in this blank.');
      }

      if (!form.reportValidity()) event.preventDefault();
    });
  </script>
</body>
</html>
