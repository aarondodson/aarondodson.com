<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aaron Dodson, UX Design Manager at Experian. Selected work in product and web design.">
  <title>Aaron Dodson — Design Leadership</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=League+Gothic&amp;display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <div class="page">
    <main>
      <div class="first-screen">
        <header class="site-header">
          <a class="wordmark" href="#top">Aaron Dodson</a>
          <nav class="site-nav" aria-label="Portfolio navigation">
            <a href="work.html">Work</a>
            <a href="about.html">About</a>
            <a href="#contact">Contact</a>
          </nav>
        </header>
        <section class="hero" aria-labelledby="hero-headline">
          <h1 class="hero-headline" id="hero-headline" aria-label="Bad UX is bad business.">
            <span class="hero-line" data-word="bad" aria-hidden="true"><span class="hero-line-text"><span class="hero-swap" data-replacement="Good"><span class="hero-swap-word">Bad</span></span> <span class="hero-static">UX is</span></span></span>
            <span class="hero-line" data-word="bad" aria-hidden="true"><span class="hero-line-text"><span class="hero-swap" data-replacement="good"><span class="hero-swap-word">bad</span></span> <span class="hero-static">busines</span></span><span class="hero-face-anchor"><span class="hero-line-text">s</span><svg class="hero-face" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true" focusable="false">
                <circle cx="50" cy="50" r="48.5"/>
                <path d="M42 17v16m16-16v16"/>
                <path class="hero-face-frown" d="M14 72a41 41 0 0 1 72 0"/>
                <path class="hero-face-smile" d="M9 50a41 41 0 0 0 82 0"/>
              </svg></span><span class="hero-line-text">.</span></span>
          </h1>
          <div class="hero-actions">
            <a class="text-link" href="work.html">View selected work <span aria-hidden="true">→</span></a>
            <button class="motion-toggle" type="button" hidden>Pause animation</button>
          </div>
        </section>
      </div>
    </main>
    <footer class="section-row site-footer" id="contact">
      <h2 class="section-label">Get in touch</h2>
      <div>
        <a class="text-link" href="https://www.linkedin.com/in/aaronjdodson/" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">↗</span></a>
      </div>
    </footer>
  </div>
  <script type="module">
    const headline = document.querySelector(".hero-headline");
    const lines = Array.from(headline.querySelectorAll(".hero-line"));
    const words = headline.querySelectorAll(".hero-swap-word");
    const face = headline.querySelector(".hero-face");
    const toggle = document.querySelector(".motion-toggle");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const originalWords = Array.from(words, word => word.textContent);
    let showingGood = false;

    function setLine(index, good) {
      const word = words[index];
      word.textContent = good ? word.parentElement.dataset.replacement : originalWords[index];
      lines[index].dataset.word = good ? "good" : "bad";
    }

    function finishHeadline(good) {
      headline.setAttribute("aria-label", good
        ? "Good UX is good business."
        : "Bad UX is bad business.");
      showingGood = good;
    }

    function setHeadline(good) {
      lines.forEach((line, index) => setLine(index, good));
      finishHeadline(good);
    }

    async function startHeadlineLoop() {
      if (reducedMotion.matches) {
        setHeadline(true);
        return;
      }

      try {
        const { animate } = await import("https://cdn.jsdelivr.net/npm/motion@12.23.24/+esm");

        if (reducedMotion.matches) {
          setHeadline(true);
          return;
        }

        let playing = true;
        let transitioning = false;
        let timer;

        function scheduleSwap() {
          if (playing && !transitioning) {
            timer = setTimeout(swap, showingGood ? 5000 : 3000);
          }
        }

        async function slideLine(line, index, good) {
          const text = Array.from(line.querySelectorAll(".hero-line-text"));
          const lineFace = line.contains(face) ? face : null;
          const exitTiming = { delay: index * .14, duration: .2, ease: "easeIn" };
          try {
            const exit = animate(text, {
              opacity: [1, 0],
              transform: ["translateY(0em)", "translateY(-.24em)"]
            }, exitTiming);
            const faceExit = lineFace && animate(lineFace, { opacity: [1, 0] }, exitTiming);

            await Promise.all([exit, faceExit]);
            exit.cancel();
            faceExit?.cancel();
            text.forEach(part => { part.style.opacity = "0"; });
            if (lineFace) lineFace.style.opacity = "0";
            setLine(index, good);

            const entrance = animate(text, {
              opacity: [0, 1],
              transform: ["translateY(.24em)", "translateY(0em)"]
            }, { duration: .34, ease: "easeOut" });
            const faceEntrance = lineFace && animate(lineFace, {
              opacity: [0, 1]
            }, { delay: .18, duration: .45, ease: "easeOut" });

            await Promise.all([entrance, faceEntrance]);
          } finally {
            text.forEach(part => {
              part.style.opacity = "";
              part.style.transform = "";
            });
            if (lineFace) lineFace.style.opacity = "";
          }
        }

        async function swap() {
          const good = !showingGood;
          transitioning = true;
          try {
            const results = await Promise.allSettled(lines.map((line, index) => slideLine(line, index, good)));
            if (results.some(result => result.status === "rejected")) throw new Error("Headline animation failed");
            finishHeadline(good);
          } catch {
            playing = false;
            toggle.hidden = true;
            setHeadline(true);
          } finally {
            transitioning = false;
            if (reducedMotion.matches) setHeadline(true);
            scheduleSwap();
          }
        }

        toggle.addEventListener("click", () => {
          playing = !playing;
          toggle.textContent = playing ? "Pause animation" : "Resume animation";
          clearTimeout(timer);
          scheduleSwap();
        });

        reducedMotion.addEventListener("change", ({ matches }) => {
          if (!matches) return;
          playing = false;
          clearTimeout(timer);
          toggle.hidden = true;
          if (!transitioning) setHeadline(true);
        });

        toggle.hidden = false;
        scheduleSwap();
      } catch {
        setHeadline(true);
      }
    }

    startHeadlineLoop();
  </script>
</body>
</html>
